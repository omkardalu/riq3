<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume IQ | Edit Profile</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <meta name="theme-color" content="#04131b">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;
            background: #04131b;
            color: white;
            padding: 30px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .riq-title {
            font-size: 30px;
            font-weight: 700;
        }

        .riq-title span {
            color: #0df0ad;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {
            background: transparent;
            color: #0df0ad;
            border: 1px solid #0df0ad;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #0df0ad;
            color: #04131b;
        }

        /* =========================
           PROFILE CARD
        ========================= */

        .profile-container {
            width: 700px;
            max-width: 100%;
            margin: 30px auto;
            background: #071f29;
            border: 1px solid #173b46;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        /* =========================
           PROFILE TOP
        ========================= */

        .profile-top {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid #173b46;
        }

        /* =========================
           COMPANY ICON
        ========================= */

        .company-icon {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: #0df0ad;
            color: #04131b;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
            font-weight: bold;
        }

        .company-name {
            margin-top: 15px;
            font-size: 26px;
            font-weight: 600;
        }

        .username {
            margin-top: 6px;
            color: #8da5ad;
            font-size: 14px;
        }

        /* =========================
           FORM
        ========================= */

        .form-section {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #8da5ad;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;

            background: #04131b;
            color: white;

            border: 1px solid #173b46;
            border-radius: 8px;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #0df0ad;
            box-shadow: 0 0 0 2px rgba(13, 240, 173, 0.08);
        }

        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 15px;
            background: #04131b;
            color: white;
            border: 1px solid #173b46;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-group textarea { min-height: 90px; resize: vertical; }
        .form-group select option { background: #071f29; color: white; }

        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #0df0ad;
            box-shadow: 0 0 0 2px rgba(13, 240, 173, 0.08);
        }

        .form-group input::placeholder {
            color: #607982;
        }

        /* =========================
           ACCOUNT STATUS
        ========================= */

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 17px 5px;

            border-top: 1px solid #173b46;
            border-bottom: 1px solid #173b46;

            margin-top: 5px;
        }

        .status-label {
            color: #8da5ad;
            font-size: 14px;
        }

        .status-value {
            color: #0df0ad;
            font-size: 15px;
            font-weight: 600;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .cancel-btn,
        .save-btn {
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        /* CANCEL */

        .cancel-btn {
            background: transparent;
            color: #0df0ad;
            border: 1px solid #0df0ad;
        }

        .cancel-btn:hover {
            background: #0df0ad;
            color: #04131b;
        }

        /* SAVE */

        .save-btn {
            background: #0df0ad;
            color: #04131b;
            border: 1px solid #0df0ad;
        }

        .save-btn:hover {
            background: #16edaa;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }

        .success {
            color: #0df0ad;
        }

        .error {
            color: #ff7070;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .header {
                align-items: flex-start;
            }

            .riq-title {
                font-size: 24px;
            }

            .profile-container {
                padding: 25px 20px;
            }

            .company-name {
                font-size: 23px;
            }

            .form-group input {
                padding: 13px;
            }

            .status-row {
                align-items: flex-start;
                gap: 10px;
            }

            .buttons {
                flex-direction: column;
            }

            .cancel-btn,
            .save-btn {
                width: 100%;
            }
        }

    </style>
    <link rel="stylesheet" href="/assets/css/shared.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div class="riq-title">
            <span>RIQ</span>
        </div>

        <button class="back-btn" onclick="goBack()">
            ←
        </button>

    </div>


    <!-- =========================
         PROFILE CARD
    ========================= -->

    <div class="profile-container">

        <!-- COMPANY HEADER -->

        <div class="profile-top">

            <div class="company-icon" id="companyIcon">
                &nbsp;
            </div>

            <div class="company-name" id="companyTitle">
                Loading...
            </div>

            <div class="username" id="usernameTitle">
                &nbsp;
            </div>

        </div>


        <!-- =========================
             EDIT FORM
        ========================= -->

        <div class="form-section">

            <!-- COMPANY NAME -->

            <div class="form-group">

                <label for="companyName">
                    Company Name
                </label>

                <input
                    type="text"
                    id="companyName"
                    placeholder="Enter company name"
                    maxlength="120"
                    disabled
                >

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    maxlength="31"
                    autocomplete="username"
                    disabled
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter company email"
                    autocomplete="email"
                    disabled
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    autocomplete="tel"
                    disabled
                >

            </div>


            <!-- ADDRESS -->
            <div class="form-group">
                <label for="address">
                    Company Address
                </label>
                <textarea
                    id="address"
                    placeholder="Enter complete company address"
                    maxlength="500"
                    disabled
                ></textarea>
            </div>
            <!-- INDUSTRY -->
            <div class="form-group">
                <label for="industry">
                    Industry
                </label>
                <select id="industry" disabled>
                    <option value="">Select industry</option>
                    <option value="IT">Information Technology</option>
                    <option value="Software">Software</option>
                    <option value="Finance">Finance &amp; Banking</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Manufacturing">Manufacturing</option>
                    <option value="Retail">Retail</option>
                    <option value="Telecommunications">Telecommunications</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <!-- ACCOUNT STATUS -->

            <div class="status-row">

                <span class="status-label">
                    Account Status
                </span>

                <span class="status-value">
                    Active
                </span>

            </div>


            <!-- =========================
                 BUTTONS
            ========================= -->

            <div class="buttons">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="cancelEdit()">
                    Cancel
                </button>

                <button
                    type="button"
                    class="save-btn"
                    id="saveButton"
                    onclick="saveProfile()"
                    disabled>
                    Save Changes
                </button>

            </div>


            <!-- MESSAGE -->

            <div
                class="message"
                id="message">
            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="/assets/js/riq.js"></script>
    <script>
        var FIELDS = {
            company_name: "companyName",
            username: "username",
            email: "email",
            phone: "phone",
            address: "address",
            industry: "industry"
        };
        var message = document.getElementById("message");

        function el(name) { return document.getElementById(FIELDS[name]); }

        function goBack() {
            RIQ.goBack("profile.html");
        }

        function cancelEdit() {
            window.location.href = "profile.html";
        }

        function showMessage(text, kind) {
            message.textContent = text;
            message.className = "message " + kind;
            message.style.display = "block";
        }

        function renderHeader(user) {
            document.getElementById("companyIcon").textContent = user.company_name.charAt(0).toUpperCase();
            document.getElementById("companyTitle").textContent = user.company_name;
            document.getElementById("usernameTitle").textContent = "@" + user.username;
        }

        function saveProfile() {
            var form = document.querySelector(".form-section");
            RIQ.clearErrors(form);
            message.style.display = "none";

            var payload = {};
            Object.keys(FIELDS).forEach(function (name) { payload[name] = el(name).value.trim(); });

            /* quick client-side checks; the server validates everything again */
            var problems = {};
            if (!payload.company_name) problems.company_name = "Please enter company name.";
            if (!payload.username) problems.username = "Please enter username.";
            if (!payload.email) problems.email = "Please enter email address.";
            else if (payload.email.indexOf("@") < 1) problems.email = "Please enter a valid email address.";
            if (!payload.phone) problems.phone = "Please enter phone number.";
            if (Object.keys(problems).length) {
                Object.keys(problems).forEach(function (n) { RIQ.fieldError(el(n), problems[n]); });
                return;
            }

            var button = document.getElementById("saveButton");
            RIQ.setBusy(button, true, "Saving...");
            RIQ.api("/api/profile", { method: "PUT", json: payload }).then(function (data) {
                renderHeader(data.user);
                showMessage("Profile updated successfully.", "success");
                setTimeout(function () { window.location.href = "profile.html"; }, 1200);
            }).catch(function (err) {
                RIQ.setBusy(button, false);
                var inputs = {};
                Object.keys(FIELDS).forEach(function (n) { inputs[n] = el(n); });
                var orphans = RIQ.showFieldErrors(err.fields, inputs);
                if (!Object.keys(err.fields).length || orphans.length) showMessage(orphans[0] || err.message, "error");
            });
        }

        RIQ.requireUser().then(function (user) {
            renderHeader(user);
            Object.keys(FIELDS).forEach(function (name) {
                var input = el(name);
                input.value = user[name] || "";
                input.disabled = false;
            });
            document.getElementById("saveButton").disabled = false;
        }).catch(function (err) {
            if (err.status !== 401) showMessage(err.message, "error");
        });
    </script>

</body>

</html>
