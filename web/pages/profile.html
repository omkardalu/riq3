
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume IQ | Company Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #04131b;
            color: white;
            padding: 30px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .riq-title {
            font-size: 30px;
            font-weight: 700;
        }

        .riq-title span {
            color: #0df0ad;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {
            background: transparent;
            color: #0df0ad;

            border: 1px solid #0df0ad;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;
        }

        .back-btn:hover {
            background: #0df0ad;
            color: #04131b;
        }


        /* =========================
           PROFILE CARD
        ========================= */

        .profile-container {

            width: 700px;
            max-width: 100%;

            margin: 30px auto;

            background: #071f29;

            border: 1px solid #173b46;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           COMPANY HEADER
        ========================= */

        .profile-top {

            text-align: center;

            padding-bottom: 30px;

            border-bottom: 1px solid #173b46;
        }


        /* COMPANY ICON */

        .company-icon {

            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            background: #0df0ad;

            color: #04131b;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 35px;

            font-weight: bold;
        }


        /* COMPANY NAME */

        .company-name {

            margin-top: 15px;

            font-size: 26px;

            color: white;
        }


        /* USERNAME */

        .username {

            margin-top: 7px;

            color: #8da5ad;

            font-size: 14px;
        }


        /* =========================
           DETAILS
        ========================= */

        .details {

            margin-top: 30px;
        }


        .detail-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 17px 5px;

            border-bottom: 1px solid #173b46;
        }


        .detail-row:last-child {

            border-bottom: none;

        }


        .detail-label {

            color: #8da5ad;

            font-size: 14px;
        }


        .detail-value {

            color: white;

            font-size: 15px;

            font-weight: 500;

            text-align: right;
        }


        /* ACTIVE STATUS */

        .active {

            color: #0df0ad;

            font-weight: bold;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 30px;
        }


        .edit-btn,
        .password-btn {

            padding: 12px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;
        }


        .edit-btn {

            background: #0df0ad;

            color: #04131b;

            border: 1px solid #0df0ad;
        }


        .edit-btn:hover {

            background: #16edaa;

        }


        .password-btn {

            background: transparent;

            color: #0df0ad;

            border: 1px solid #0df0ad;
        }


        .password-btn:hover {

            background: #0df0ad;

            color: #04131b;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .header {
                align-items: flex-start;
            }

            .riq-title {
                font-size: 24px;
            }

            .profile-container {
                padding: 25px 20px;
            }

            .detail-row {

                flex-direction: column;

                align-items: flex-start;

                gap: 6px;
            }

            .detail-value {

                text-align: left;

            }

            .buttons {

                flex-direction: column;

            }

            .edit-btn,
            .password-btn {

                width: 100%;

            }

        }

    </style>

    <link rel="stylesheet" href="/assets/css/shared.css">
</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1 class="riq-title">
            RESUME <span>IQ</span>
        </h1>

        <button class="back-btn" onclick="goBack()">
            ←
        </button>

    </div>



    <!-- =========================
         COMPANY PROFILE
    ========================= -->

    <div class="profile-container">


        <!-- COMPANY HEADER -->

        <div class="profile-top">

            <div class="company-icon" id="companyIcon">
                &nbsp;
            </div>

            <h2 class="company-name" id="companyName">
                Loading...
            </h2>

            <p class="username" id="username">
                &nbsp;
            </p>

        </div>



        <!-- COMPANY DETAILS -->

        <div class="details">


            <!-- COMPANY NAME -->

            <div class="detail-row">

                <span class="detail-label">
                    Company Name
                </span>

                <span class="detail-value" id="companyNameDetail">
                    &mdash;
                </span>

            </div>


            <!-- USERNAME -->

            <div class="detail-row">

                <span class="detail-label">
                    Username
                </span>

                <span class="detail-value" id="usernameDetail">
                    &mdash;
                </span>

            </div>


            <!-- EMAIL -->

            <div class="detail-row">

                <span class="detail-label">
                    Email Address
                </span>

                <span class="detail-value" id="email">
                    &mdash;
                </span>

            </div>


            <!-- PHONE -->

            <div class="detail-row">

                <span class="detail-label">
                    Phone Number
                </span>

                <span class="detail-value" id="phone">
                    &mdash;
                </span>

            </div>


            <!-- ADDRESS -->

            <div class="detail-row">

                <span class="detail-label">
                    Address
                </span>

                <span class="detail-value" id="address">
                    &mdash;
                </span>

            </div>


            <!-- INDUSTRY -->

            <div class="detail-row">

                <span class="detail-label">
                    Industry
                </span>

                <span class="detail-value" id="industry">
                    &mdash;
                </span>

            </div>


            <!-- ACCOUNT STATUS -->

            <div class="detail-row">

                <span class="detail-label">
                    Account Status
                </span>

                <span class="detail-value active">
                    Active
                </span>

            </div>


        </div>



        <!-- BUTTONS -->

        <div class="buttons">

            <button class="edit-btn" onclick="editProfile()">
                Edit Profile
            </button>

            <button class="password-btn" onclick="changePassword()">
                Change Password
            </button>

        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="/assets/js/riq.js"></script>
    <script>

        /* BACK BUTTON */

        function goBack() {
            RIQ.goBack("homepage.html");
        }


        /* EDIT PROFILE */

        function editProfile() {
            window.location.href = "edit-profile.html";
        }


        /* CHANGE PASSWORD */

        function changePassword() {
            window.location.href = "change-password.html";
        }


        /* LOAD THE SIGNED-IN COMPANY */

        function show(id, value) {
            document.getElementById(id).textContent = value || "\u2014";
        }

        RIQ.requireUser().then(function (user) {
            document.title = "Resume IQ | " + user.company_name;
            document.getElementById("companyIcon").textContent = user.company_name.charAt(0).toUpperCase();
            show("companyName", user.company_name);
            show("username", "@" + user.username);
            show("companyNameDetail", user.company_name);
            show("usernameDetail", "@" + user.username);
            show("email", user.email);
            show("phone", user.phone);
            show("address", user.address);
            show("industry", user.industry);
        }).catch(function (err) {
            if (err.status !== 401) {
                show("companyName", "Could not load your profile");
                RIQ.toast(err.message, "error");
            }
        });

    </script>


</body>

</html>
