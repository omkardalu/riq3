<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume IQ | Change Password</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;
            background: #04131b;
            color: white;
            padding: 30px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .riq-title {
            font-size: 30px;
            font-weight: 700;
        }

        .riq-title span {
            color: #0df0ad;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {
            background: transparent;
            color: #0df0ad;
            border: 1px solid #0df0ad;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #0df0ad;
            color: #04131b;
        }

        /* =========================
           PASSWORD CARD
        ========================= */

        .password-container {
            width: 700px;
            max-width: 100%;
            margin: 30px auto;

            background: #071f29;

            border: 1px solid #173b46;
            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);
        }

        /* =========================
           PASSWORD HEADER
        ========================= */

        .password-top {
            text-align: center;

            padding-bottom: 30px;

            border-bottom: 1px solid #173b46;
        }

        /* =========================
           LOCK ICON
        ========================= */

        .lock-icon {
            width: 80px;
            height: 80px;

            margin: auto;

            border-radius: 50%;

            background: #0df0ad;
            color: #04131b;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
            font-weight: bold;
        }

        /* =========================
           TITLE
        ========================= */

        .password-title {
            margin-top: 18px;

            font-size: 26px;
            font-weight: 600;
        }

        .password-subtitle {
            margin-top: 7px;

            color: #8da5ad;

            font-size: 14px;
        }

        /* =========================
           FORM
        ========================= */

        .form-section {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 9px;

            color: #8da5ad;

            font-size: 14px;
        }

        /* =========================
           PASSWORD INPUT
        ========================= */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;

            padding: 14px 48px 14px 15px;

            background: #04131b;

            color: white;

            border: 1px solid #173b46;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .password-wrapper input:focus {
            border-color: #0df0ad;

            box-shadow:
                0 0 0 2px rgba(13, 240, 173, 0.08);
        }

        .password-wrapper input::placeholder {
            color: #607982;
        }

        /* =========================
           EYE BUTTON
        ========================= */

        .toggle-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            background: transparent;
            border: none;

            color: #8da5ad;

            cursor: pointer;

            font-size: 15px;

            padding: 4px;
        }

        .toggle-password:hover {
            color: #0df0ad;
        }

        /* =========================
           PASSWORD RULE
        ========================= */

        .password-rule {
            margin-top: 8px;

            color: #607982;

            font-size: 12px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            justify-content: center;

            gap: 15px;

            margin-top: 30px;
        }

        .cancel-btn,
        .change-btn {
            padding: 12px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        /* CANCEL */

        .cancel-btn {
            background: transparent;

            color: #0df0ad;

            border: 1px solid #0df0ad;
        }

        .cancel-btn:hover {
            background: #0df0ad;

            color: #04131b;
        }

        /* CHANGE PASSWORD */

        .change-btn {
            background: #0df0ad;

            color: #04131b;

            border: 1px solid #0df0ad;
        }

        .change-btn:hover {
            background: #16edaa;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

            line-height: 1.5;
        }

        .success {
            color: #0df0ad;
        }

        .error {
            color: #ff7070;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .header {
                align-items: flex-start;
            }

            .riq-title {
                font-size: 24px;
            }

            .password-container {
                padding: 25px 20px;
            }

            .password-title {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
            }

            .cancel-btn,
            .change-btn {
                width: 100%;
            }

        }

    </style>
    <link rel="stylesheet" href="/assets/css/shared.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div class="riq-title">
            <span>RIQ</span>
        </div>

        <button class="back-btn" onclick="goBack()">
            ←
        </button>

    </div>


    <!-- =========================
         PASSWORD CARD
    ========================= -->

    <div class="password-container">

        <!-- PASSWORD HEADER -->

        <div class="password-top">

            <div class="lock-icon">
                🔒
            </div>

            <div class="password-title">
                Change Your Password
            </div>

            <div class="password-subtitle">
                Keep your account secure
            </div>

        </div>


        <!-- =========================
             FORM
        ========================= -->

        <div class="form-section">

            <!-- CURRENT PASSWORD -->

            <div class="form-group">

                <label for="currentPassword">
                    Current Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter your current password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('currentPassword', this)">
                        Show
                    </button>

                </div>

            </div>


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('newPassword', this)">
                        Show
                    </button>

                </div>

                <div class="password-rule">
                    Password must be at least 8 characters.
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)">
                        Show
                    </button>

                </div>

            </div>


            <!-- =========================
                 BUTTONS
            ========================= -->

            <div class="buttons">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="cancelPasswordChange()">
                    Cancel
                </button>

                <button
                    type="button"
                    class="change-btn"
                    id="changeButton"
                    onclick="changePassword()">
                    Change Password
                </button>

            </div>


            <!-- MESSAGE -->

            <div
                class="message"
                id="message">
            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="/assets/js/riq.js"></script>
    <script>
        var message = document.getElementById("message");

        function goBack() {
            RIQ.goBack("profile.html");
        }

        function cancelPasswordChange() {
            window.location.href = "profile.html";
        }

        function togglePassword(inputId, button) {
            var input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                button.textContent = "Hide";
            } else {
                input.type = "password";
                button.textContent = "Show";
            }
        }

        function showMessage(text, kind) {
            message.textContent = text;
            message.className = "message " + kind;
            message.style.display = "block";
        }

        function changePassword() {
            var current = document.getElementById("currentPassword");
            var fresh = document.getElementById("newPassword");
            var confirm = document.getElementById("confirmPassword");
            var form = document.querySelector(".form-section");

            RIQ.clearErrors(form);
            message.style.display = "none";

            /* quick client-side checks; the server validates everything again */
            if (!current.value) return RIQ.fieldError(current, "Please enter your current password.");
            if (!fresh.value) return RIQ.fieldError(fresh, "Please enter a new password.");
            if (fresh.value.length < 8) return RIQ.fieldError(fresh, "Password must be at least 8 characters.");
            if (!confirm.value) return RIQ.fieldError(confirm, "Please confirm your new password.");
            if (fresh.value !== confirm.value) return RIQ.fieldError(confirm, "Passwords do not match.");

            var button = document.getElementById("changeButton");
            RIQ.setBusy(button, true, "Changing...");
            RIQ.api("/api/profile/password", {
                method: "POST",
                json: {
                    current_password: current.value,
                    new_password: fresh.value,
                    confirm_password: confirm.value
                }
            }).then(function () {
                current.value = fresh.value = confirm.value = "";
                showMessage("Password changed successfully.", "success");
                setTimeout(function () { window.location.href = "profile.html"; }, 1500);
            }).catch(function (err) {
                RIQ.setBusy(button, false);
                var orphans = RIQ.showFieldErrors(err.fields, {
                    current_password: current,
                    new_password: fresh,
                    confirm_password: confirm
                });
                if (!Object.keys(err.fields).length || orphans.length) showMessage(orphans[0] || err.message, "error");
            });
        }

        /* make sure there is a signed-in session before showing the form */
        RIQ.requireUser().catch(function () {});
    </script>

</body>

</html>
